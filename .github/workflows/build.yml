name: Build SeaWave APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Gradle and build debug APK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o g.zip
          unzip -q g.zip
          ./gradle-8.11.1/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SeaWave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
